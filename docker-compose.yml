version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PORT=8000
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
              gunicorn mini.wsgi:application --bind 0.0.0.0:8000"

  # Alternative service for development with auto-reload
  dev:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PORT=8000
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000